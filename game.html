<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trevity battle</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: 'VT323', monospace;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .crt::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%),
                        linear-gradient(90deg, rgba(255,0,0,0.06), rgba(0,255,0,0.02), rgba(0,0,255,0.06));
            z-index: 999;
            background-size: 100% 3px, 4px 100%;
            pointer-events: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        canvas {
            background: #000;
            border: 2px solid #fff;
            box-shadow: 0 0 30px rgba(255,255,255,0.35);
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }
        #touch-controls {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 42%;
            pointer-events: none;
            z-index: 100;
        }
        #touch-controls.active { display: block; }
        .dpad {
            position: absolute;
            left: 18px;
            bottom: 28px;
            width: 150px;
            height: 150px;
            pointer-events: auto;
        }
        .dpad-btn {
            position: absolute;
            width: 48px;
            height: 48px;
            background: rgba(255,255,255,0.12);
            border: 2px solid rgba(255,255,255,0.55);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #fff;
            user-select: none;
            box-shadow: 0 0 8px rgba(255,255,255,0.15);
            transition: background 0.08s, transform 0.08s;
        }
        .dpad-btn:active, .dpad-btn.pressed {
            background: rgba(255,255,0,0.55);
            transform: scale(0.92);
            box-shadow: 0 0 12px rgba(255,255,0,0.5);
        }
        .up    { top: 0; left: 51px; }
        .down  { bottom: 0; left: 51px; }
        .left  { top: 51px; left: 0; }
        .right { top: 51px; right: 0; }
        .action-btns {
            position: absolute;
            right: 22px;
            bottom: 36px;
            display: flex;
            gap: 18px;
            pointer-events: auto;
        }
        .act-btn {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: rgba(255,255,255,0.12);
            border: 2px solid rgba(255,255,255,0.6);
            color: #fff;
            font-family: 'VT323', monospace;
            font-size: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            box-shadow: 0 0 10px rgba(255,255,255,0.18);
            transition: background 0.08s, transform 0.08s;
        }
        .act-btn:active, .act-btn.pressed {
            background: rgba(255,255,0,0.55);
            transform: scale(0.92);
            box-shadow: 0 0 14px rgba(255,255,0,0.55);
        }
        .btn-z {
            background: rgba(0,220,80,0.22);
            border-color: rgba(80,255,120,0.7);
        }
        .btn-x {
            background: rgba(220,40,40,0.22);
            border-color: rgba(255,80,80,0.7);
        }
        @media (hover: none) and (pointer: coarse) {
            #touch-controls { display: block; }
        }
    </style>
</head>
<body class="crt">
    <div id="game-container">
        <canvas id="c"></canvas>
    </div>

    <div id="touch-controls">
        <div class="dpad">
            <div class="dpad-btn up" data-key="ArrowUp">▲</div>
            <div class="dpad-btn down" data-key="ArrowDown">▼</div>
            <div class="dpad-btn left" data-key="ArrowLeft">◀</div>
            <div class="dpad-btn right" data-key="ArrowRight">▶</div>
        </div>
        <div class="action-btns">
            <div class="act-btn btn-x" data-key="KeyX">X</div>
            <div class="act-btn btn-z" data-key="KeyZ">Z</div>
        </div>
    </div>

    <script>
        const fun_value= Math.floor(Math.random() * (100 - 10 + 1)) + 10;
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        const VIRTUAL_WIDTH = 1440;
        const VIRTUAL_HEIGHT = 800;
        
        canvas.width = VIRTUAL_WIDTH;
        canvas.height = VIRTUAL_HEIGHT;

        let state = 'MENU';
        let playerHP = 92, maxHP = 92;
        let bossHP = 2800, maxBossHP = 2800;
        let menuIdx = 0, actIdx = 0;
        let dialogue = "* Trevity blocks the way!!.\nIt has no mercy left after loses on valorant\n and lost 1 dollar on crazy time.";
        let dialogueTimer = 0;
        let attackIdx = 0;
        let timer = 0;
        let shake = 0;
        let barX = 100, barDir = 1;
        let currentHelp = null;        
        let helpAlpha = 0;             
        let helpX = -120;            
        let helpTargetX = 15;          
        let helpTimer = 120;

        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        const playerName = urlParams.get("nome");

        const imgBoss = new Image();
        const imgBlasterNormal = new Image();
        const imgBlasterFiring = new Image();
        const imgBeam = new Image();

        const helpImages = {
            doc: new Image(),
            mario: new Image(),
            erica: new Image()
        };
        helpImages.doc.src = "./src/doc.jpg";
        helpImages.mario.src = "./src/mario.jpg";
        helpImages.erica.src = "./src/erica.jpg";

        imgBeam.src = "./src/beam.jpeg";
        imgBoss.src = "./src/boss.jpeg";         
        imgBlasterNormal.src = "./src/blaster_normal.png";  
        imgBlasterFiring.src = "./src/blaster_firing.png";

        const videoEvoke = document.createElement('video');
        videoEvoke.src = "./src/enrico_papi.mp4";
        videoEvoke.playsInline = true;
        videoEvoke.preload = "auto";
        videoEvoke.muted = false;
        videoEvoke.volume = 1.0;

        let evokeActive = false;
        let evokePhase = 'idle';
        let evokeAlpha = 0;
        let evokeScale = 0.3;
        let evokeTimer = 0;

        const menu = ['FIGHT', 'ACT', 'ITEM', 'SPARE'];
        const acts = ['CHECK', 'INSULT', 'EVOKE', 'REQUEST HELP'];
        const help = ['doc', 'mario', 'erica', 'giacca di pelle', 'chiarini','dragos'];
        const items = ['Pie', 'Legendary Hero', 'Legendary Hero', 'Legendary Hero', 'Legendary Hero', 'Snowman Piece', 'Snowman Piece', 'Snowman Piece', 'Snowman Piece'];
        
        let bonusPower = false;

        const BOX_DEFAULT = { w: 920, h: 360 };
        const BOX_FIGHT   = { w: 1100, h: 110 };
        const BOX_DEFEND  = { w: 620, h: 280 };

        const box = { x: 260, y: 240, w: 920, h: 360 };

        function setBoxSize(mode) {
            let target;
            if (mode === 'FIGHT') target = BOX_FIGHT;
            else if (mode === 'DEFEND') target = BOX_DEFEND;
            else target = BOX_DEFAULT;
            box.w = target.w;
            box.h = target.h;
            box.x = Math.floor((VIRTUAL_WIDTH - box.w) / 2);
            box.y = Math.floor(240 + (360 - box.h) / 2);
        }

        const soul = {
            x: 720, y: 360,
            size: 12,
            speed: 4.5,
            inv: 0
        };

        const boss = { x: 720, y: 90, bob: 0 };
        let bones = [], bullets = [], blasters = [];
        const keys = {};

        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            handleKey(e.code);
            e.preventDefault();
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        function getBoneLenght() {
            return (45 + Math.random() * 35);
        }

        function setKey(code, pressed) {
            keys[code] = pressed;
            if (pressed) handleKey(code);
        }

        document.querySelectorAll('[data-key]').forEach(el => {
            const code = el.dataset.key;
            const on = (e) => {
                e.preventDefault();
                el.classList.add('pressed');
                setKey(code, true);
            };
            const off = (e) => {
                e.preventDefault();
                el.classList.remove('pressed');
                setKey(code, false);
            };
            el.addEventListener('touchstart', on, { passive: false });
            el.addEventListener('touchend', off, { passive: false });
            el.addEventListener('touchcancel', off, { passive: false });
            el.addEventListener('mousedown', on);
            el.addEventListener('mouseup', off);
            el.addEventListener('mouseleave', off);
        });

        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            if (!e.target.closest('#touch-controls')) {
                setKey('KeyZ', true);
                setTimeout(() => setKey('KeyZ', false), 80);
            }
        }, { passive: false });

        function handleKey(code) {
            if (state === 'MENU') {
                if (code === 'ArrowLeft' || code === 'KeyA') menuIdx = (menuIdx + 3) % 4;
                if (code === 'ArrowRight' || code === 'KeyD') menuIdx = (menuIdx + 1) % 4;
                if (code === 'KeyZ' || code === 'Enter') chooseMenu();
            } else if (state === 'ACT') {
                if (code === 'ArrowUp' || code === 'KeyW') actIdx = (actIdx + 3) % 4;
                if (code === 'ArrowDown' || code === 'KeyS') actIdx = (actIdx + 1) % 4;
                if (code === 'KeyZ' || code === 'Enter') doAct();
                if (code === 'KeyX' || code === 'Backspace') {
                    state = 'MENU';
                    setBoxSize('DEFAULT');
                }
            } else if (state === 'FIGHT') {
                if (code === 'KeyZ' || code === 'Enter') {
                    const center = box.x + box.w / 2;
                    const dist = Math.abs(barX - center);
                    let power = Math.max(0, Math.floor(145 - (dist / (box.w / 2)) * 175) + 30);
                    if (bonusPower === true) {
                        power = power * 3;
                        bonusPower = false;
                    }
                    bossHP = Math.max(0, bossHP - power);
                    dialogue = power > 110 ? `* Critical hit! ${power} damage!` : `* You dealt ${power} damage.`;
                    state = 'DIALOGUE';
                    setBoxSize('DEFAULT');
                    dialogueTimer = 50;
                    if (bossHP <= 0) state = 'VICTORY';
                }
            } else if (state === 'DIALOGUE') {
                if (code === 'KeyZ' || code === 'Enter') {
                    if (bossHP <= 0) state = 'VICTORY';
                    else if (!evokeActive) startDefend();
                }
            }
        }

        function chooseMenu() {
            if (menuIdx === 0) {
                state = 'FIGHT';
                setBoxSize('FIGHT');
                barX = box.x + 40;
                barDir = 1;
            } else if (menuIdx === 1) {
                state = 'ACT';
                actIdx = 0;
                setBoxSize('DEFAULT');
            } else if (menuIdx === 2) {
                if (playerHP < maxHP) {
                    let food = items[Math.floor(Math.random() * items.length)];
                    if (food == "Legendary Hero") {
                        playerHP = Math.min(maxHP, playerHP + 40);
                        dialogue = (playerHP == maxHP) ? "* You ate a Legendary Hero.\nHP full restored" : "* You ate a Legendary Hero.\nHP restored by 40.";
                    } else if (food == "Pie") {
                        playerHP = maxHP;
                        dialogue = "* You ate a Pie.\nHP full restored.";
                    } else if (food == "Snowman Piece") {
                        playerHP = Math.min(maxHP, playerHP + 45);
                        dialogue = (playerHP == maxHP) ? "* You ate a Snowman Piece.\nHP full restored" : "* You ate a Snowman Piece.\nHP restored by 45.";
                    }
                } else {
                    dialogue = "* Your HP is already full.";
                }
                state = 'DIALOGUE';
                setBoxSize('DEFAULT');
                dialogueTimer = 55;
            } else {
                if (bossHP <= 320) {
                    dialogue = "* ... It accepted your mercy.";
                    state = 'VICTORY';
                } else {
                    dialogue = "* The enemy refuses mercy.\nIts killing intent grows stronger.";
                    state = 'DIALOGUE';
                    setBoxSize('DEFAULT');
                    dialogueTimer = 60;
                }
            }
        }

        function doAct() {
            const a = acts[actIdx];
            if (a === 'CHECK') dialogue = "* Trevity - ATK 18 DEF 14\nExtremely experienced in gambling. Knows every pattern.";
            if (a === 'INSULT') dialogue = "* You insulted Trevity.\nIt didn't care.";
            if (a === 'EVOKE') {
                dialogue = "* You evoke Enrico Papi!";
                state = 'DIALOGUE';
                setBoxSize('DEFAULT');
                dialogueTimer = 40;
                evokeActive = true;
                evokePhase = 'enter';
                evokeAlpha = 0;
                evokeScale = 0.3;
                evokeTimer = 0;
                
                videoEvoke.currentTime = 0;
                videoEvoke.muted = false;
                videoEvoke.volume = 1.0;
                const playPromise = videoEvoke.play();
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        console.log("Autoplay bloccato dal browser, riprovo al prossimo input:", error);
                    });
                }
                return;
            }
            if (a === 'REQUEST HELP') {
                const h = help[Math.floor(Math.random() * help.length)];
                currentHelp = null;          
                helpAlpha = 0;
                helpX = -120;

                if (h === "doc") {
                    dialogue = "* You looking for a help\nThe doc give you a math lesson\nYour power increased";
                    bonusPower = true;
                    currentHelp = "doc";
                } else if (h === "mario") {
                    dialogue = "* Mario appears!\nHe gives you moral support.";
                    currentHelp = "mario";
                } else if (h === "erica") {
                    dialogue = "* Erica helps you!\nYou feel slightly stronger.";
                    currentHelp = "erica";
                } else if (h === "giacca di pelle") {
                    dialogue = "* Giacca di pelle ti offre una sigaretta!\nPerdi 10 HP";
                } else if (h === "chiarini") {
                    dialogue = "* Chiarini ti dà una mano!\nLuck increased.";
                    currentHelp = "chiarini";
                }else if(h==="dragos"){
                    dialogue= "* Dragos casta Fireball\n-50 HP a Tevity!!";
                    currentHelp = "dragos";
                    bossHP-=50;
                }
                
                if (currentHelp) {
                    helpTimer = 100; 
                    helpAlpha = 0;
                    helpX = -120;
                }
            }
            state = 'DIALOGUE';
            setBoxSize('DEFAULT');
            dialogueTimer = 65;
        }

        function startDefend(repeat = false) {
            state = 'DEFEND';
            setBoxSize('DEFEND');
            timer = 0;
            bones = [];
            bullets = [];
            blasters = [];
            soul.x = box.x + box.w / 2;
            soul.y = box.y + box.h / 2;
            soul.inv = 0;
            if (!repeat) attackIdx = (attackIdx + 1) % 14;
        }

        function createBlaster(side, aimX, aimY) {
            const margin = 200;          
            const startMargin = 220;   

            let finalX, finalY, tx, ty;

            if (side === 'top') {
                finalX = aimX; finalY = box.y - margin;
                tx = aimX; ty = box.y + box.h + margin;
            } else if (side === 'bottom') {
                finalX = aimX; finalY = box.y + box.h + margin;
                tx = aimX; ty = box.y - margin;
            } else if (side === 'left') {
                finalX = box.x - margin; finalY = aimY;
                tx = box.x + box.w + margin; ty = aimY;
            } else {
                finalX = box.x + box.w + margin; finalY = aimY;
                tx = box.x - margin; ty = aimY;
            }

            let startX = finalX;
            let startY = finalY;

            if (side === 'top')    startY = box.y - startMargin;
            if (side === 'bottom') startY = box.y + box.h + startMargin;
            if (side === 'left')   startX = box.x - startMargin;
            if (side === 'right')  startX = box.x + box.w + startMargin;

            return {
                x: startX, y: startY,
                startX, startY,
                finalX, finalY,
                tx, ty,
                timer: 160,
                appearTime: 22,
                fire: false,
                fireProgress: 0,
                fireDuration: 20,
                wide: true,
                alpha: 0,
                scale: 0.5,
                retreating: false,  
                retreatProgress: 0  
            };
        }

        function spawn() {
            const phase = bossHP < maxBossHP * 0.25 ? 2 : (bossHP < maxBossHP * 0.55 ? 1 : 0);
            const t = timer;
            const cx = box.x + box.w / 2;
            const cy = box.y + box.h / 2;

            switch (attackIdx) {
                case 0: {
                    const bossPercent = bossHP / maxBossHP;
                    const intensity = 1.3 + (1 - bossPercent) * 1.6;
                    if (t < 220) {
                        if (t % Math.max(6, Math.floor(14 / intensity)) === 0) {
                            bones.push({
                                x: box.x + 20 + Math.random() * (box.w - 40),
                                y: box.y - 90,
                                vx: (Math.random() - 0.5) * 2.5,
                                vy: (6.0 + phase * 1.5) * intensity,
                                w: 26, h: getBoneLenght()
                            });
                        }
                        if (t % 20 === 0) {
                            const a = Math.atan2(soul.y - (boss.y + 35), soul.x - boss.x);
                            bullets.push({
                                x: boss.x, y: boss.y + 35,
                                vx: Math.cos(a) * 5.0 * intensity, vy: Math.sin(a) * 5.0 * intensity,
                                r: 7, color: '#ff3333'
                            });
                        }
                    } else {
                        if (t % 8 === 0) {
                            bones.push({
                                x: box.x + Math.random() * box.w,
                                y: box.y - 70,
                                vx: 0, vy: 7.0 * intensity,
                                w: 18, h: getBoneLenght()
                            });
                        }
                        if (t % 25 === 0) {
                            const side = Math.random() > 0.5;
                            bones.push({
                                x: side ? box.x + 10 : box.x + box.w - 10,
                                y: box.y + 20 + Math.random() * (box.h - 40),
                                vx: side ? 5.0 : -5.0, vy: 0,
                                w: 18, h: getBoneLenght()
                            });
                        }
                        if (t === 260 || t === 340) {
                            blasters.push(createBlaster('top', soul.x, soul.y));
                        }
                    }
                    break;
                }
                case 1: {
                    if (t === 30 || t === 120 || t === 210) {
                        const side = Math.random() > 0.5 ? 'left' : 'right';
                        blasters.push(createBlaster(side, cx, cy));
                    }
                    if (t % 15 === 0) {
                        const base = t * 0.15;
                        for (let i = 0; i < 4; i++) {
                            const a = base + i * (Math.PI / 2);
                            bullets.push({
                                x: boss.x, y: boss.y + 35,
                                vx: Math.cos(a) * 4.5, vy: Math.sin(a) * 4.5,
                                r: 7, color: '#ff2222'
                            });
                        }
                    }
                    if (t % 25 === 0) {
                        bones.push({
                            x: box.x + Math.random() * box.w,
                            y: box.y - 70,
                            vx: 0, vy: 5.5,
                            w: 14, h: getBoneLenght()
                        });
                    }
                    break;
                }
                case 2: {
                    if (t === 40 || t === 100 || t === 160 || t === 220 || t === 300) {
                        const rx = box.x + 50 + Math.random() * (box.w - 100);
                        blasters.push(createBlaster('top', rx, cy));
                    }
                    if (t % 18 === 0) {
                        const top = Math.random() > 0.5;
                        bones.push({
                            x: box.x + box.w - 30,
                            y: top ? box.y + 10 : box.y + box.h - 50,
                            vx: -5.5, vy: 0,
                            w: 16, h: getBoneLenght()
                        });
                    }
                    if (t % 30 === 0) {
                        const a = Math.atan2(soul.y - (boss.y + 35), soul.x - boss.x);
                        bullets.push({
                            x: boss.x, y: boss.y + 35,
                            vx: Math.cos(a) * 5.0, vy: Math.sin(a) * 5.0,
                            r: 7, color: '#ff00ff'
                        });
                    }
                    break;
                }
                case 3: {
                    if (t % 10 === 0) {
                        const base = t * 0.12;
                        for (let i = 0; i < 6; i++) {
                            const a = base + i * (Math.PI * 2 / 6);
                            bullets.push({
                                x: box.x + box.w / 2, y: box.y + box.h / 2,
                                vx: Math.cos(a) * 4.0, vy: Math.sin(a) * 4.0,
                                r: 6, color: '#00ffff'
                            });
                        }
                    }
                    if (t === 80 || t === 180 || t === 280) {
                        blasters.push(createBlaster('left', cx, cy));
                    }
                    if (t % 22 === 0) {
                        bones.push({
                            x: box.x + Math.random() * box.w,
                            y: box.y - 65,
                            vx: 0, vy: 6.0,
                            w: 16, h: getBoneLenght()
                        });
                    }
                    break;
                }
                case 4: {
                    if (t % 14 === 0) {
                        const side = Math.random() > 0.5;
                        bones.push({
                            x: side ? box.x + 20 : box.x + box.w - 20,
                            y: box.y + 10 + Math.random() * (box.h - 20),
                            vx: side ? 5.0 : -5.0, vy: 0,
                            w: 16, h: getBoneLenght()
                        });
                    }
                    if (t % 35 === 0) {
                        blasters.push(createBlaster('top', soul.x, soul.y));
                    }
                    if (t % 20 === 0) {
                        bullets.push({
                            x: boss.x, y: boss.y + 35,
                            vx: (Math.random() - 0.5) * 6.0, vy: 4.5,
                            r: 7, color: '#ffff00'
                        });
                    }
                    break;
                }
                case 5: {
                    if (t === 50 || t === 130 || t === 210 || t === 290) {
                        blasters.push(createBlaster('top', cx, cy));
                        blasters.push(createBlaster('left', cx, cy));
                    }
                    if (t % 12 === 0) {
                        bones.push({
                            x: box.x + Math.random() * box.w,
                            y: box.y - 70,
                            vx: (Math.random() - 0.5) * 3.0, vy: 6.5,
                            w: 14, h: getBoneLenght()
                        });
                    }
                    break;
                }
                case 6: {
                    if (t % 15 === 0) {
                        bullets.push({
                            x: Math.random() > 0.5 ? box.x + 20 : box.x + box.w - 20,
                            y: box.y + Math.random() * box.h,
                            vx: Math.random() > 0.5 ? 5.0 : -5.0,
                            vy: (Math.random() - 0.5) * 4.0,
                            r: 8, color: '#ffff00', bounce: true
                        });
                    }
                    if (t === 70 || t === 170 || t === 270) {
                        const rx = box.x + 40 + Math.random() * (box.w - 80);
                        blasters.push(createBlaster('top', rx, cy));
                    }
                    if (t % 20 === 0) {
                        bones.push({
                            x: box.x + Math.random() * box.w,
                            y: box.y - 60,
                            vx: 0, vy: 6.2,
                            w: 16, h: getBoneLenght()
                        });
                    }
                    break;
                }
                case 7: {
                    if (t % 10 === 0) {
                        const base = t * 0.1;
                        for (let i = 0; i < 7; i++) {
                            const a = base + i * (Math.PI * 2 / 7);
                            bullets.push({
                                x: boss.x, y: boss.y + 35,
                                vx: Math.cos(a) * 4.8, vy: Math.sin(a) * 4.8,
                                r: 6, color: '#ff66ff'
                            });
                        }
                    }
                    if (t % 25 === 0) {
                        bones.push({ x: box.x + 20, y: box.y + 20, vx: 5.0, vy: 0, w: 16, h: getBoneLenght() });
                        bones.push({ x: box.x + box.w - 20, y: box.y + box.h - 40, vx: -5.0, vy: 0, w: 16, h: getBoneLenght() });
                    }
                    break;
                }
                case 8: {
                    if (t === 40 || t === 100 || t === 160 || t === 220 || t === 300) {
                        blasters.push(createBlaster('left', cx, cy));
                    }
                    if (t % 14 === 0) {
                        bones.push({
                            x: box.x + Math.random() * box.w,
                            y: box.y - 70,
                            vx: 0, vy: 6.8,
                            w: 16, h: getBoneLenght()
                        });
                    }
                    break;
                }
                case 9: {
                    if (t % 12 === 0) {
                        bones.push({
                            x: box.x + box.w - 30,
                            y: box.y + Math.random() * box.h,
                            vx: -5.5, vy: 0,
                            w: 16, h: getBoneLenght()
                        });
                    }
                    if (t % 22 === 0) {
                        const a = Math.atan2(soul.y - (boss.y + 35), soul.x - boss.x);
                        bullets.push({
                            x: boss.x, y: boss.y + 35,
                            vx: Math.cos(a) * 5.5, vy: Math.sin(a) * 5.5,
                            r: 7, color: '#ff3333'
                        });
                    }
                    if (t === 90 || t === 200 || t === 310) {
                        blasters.push(createBlaster('top', soul.x, soul.y));
                    }
                    break;
                }
                case 10: {
                    if (t % 10 === 0) {
                        const base = t * 0.14;
                        for (let i = 0; i < 8; i++) {
                            const a = base + i * (Math.PI * 2 / 8);
                            bullets.push({
                                x: boss.x, y: boss.y + 35,
                                vx: Math.cos(a) * 5.2, vy: Math.sin(a) * 5.2,
                                r: 6, color: '#ff2222'
                            });
                        }
                    }
                    if (t % 16 === 0) {
                        bones.push({
                            x: box.x + Math.random() * box.w,
                            y: box.y - 70,
                            vx: 0, vy: 6.5,
                            w: 15, h: getBoneLenght()
                        });
                    }
                    break;
                }
                case 11: {
                    if (t % 10 === 0) {
                        bones.push({
                            x: box.x + box.w - 30,
                            y: box.y + Math.random() * box.h,
                            vx: -6.0, vy: 0,
                            w: 16, h: getBoneLenght()
                        });
                    }
                    if (t === 60 || t === 130 || t === 200 || t === 270) {
                        blasters.push(createBlaster('left', cx, cy));
                    }
                    break;
                }
                case 12: {
                    if (t % 12 === 0) {
                        bones.push({ x: box.x + 30, y: box.y + Math.random() * box.h, vx: 5.5, vy: 0, w: 16, h: getBoneLenght() });
                        bones.push({ x: box.x + box.w - 30, y: box.y + Math.random() * box.h, vx: -5.5, vy: 0, w: 16, h: getBoneLenght() });
                    }
                    if (t % 20 === 0) {
                        const a = Math.random() * Math.PI * 2;
                        bullets.push({
                            x: boss.x, y: boss.y + 30,
                            vx: Math.cos(a) * 5.8, vy: Math.sin(a) * 5.8,
                            r: 7, color: '#ff4444'
                        });
                    }
                    break;
                }
                case 13: {
                    if (t % 8 === 0) {
                        bones.push({
                            x: box.x + Math.random() * box.w,
                            y: box.y - 70,
                            vx: 0, vy: 7.5,
                            w: 16, h: getBoneLenght()
                        });
                    }
                    if (t === 50 || t === 120 || t === 190 || t === 260) {
                        blasters.push(createBlaster('top', soul.x, soul.y));
                    }
                    if (t % 12 === 0) {
                        const a = Math.random() * Math.PI * 2;
                        bullets.push({
                            x: boss.x, y: boss.y + 30,
                            vx: Math.cos(a) * 6.0, vy: Math.sin(a) * 6.0,
                            r: 7, color: '#ff1111'
                        });
                    }
                    break;
                }
            }
        }

        function update() {
            if (shake > 0) shake--;

            if (currentHelp) {
                if (helpAlpha < 1) helpAlpha += 0.07;
                if (helpX < helpTargetX) {
                    helpX += (helpTargetX - helpX) * 0.2;
                }
                helpTimer--;
                if (helpTimer <= 0) currentHelp = null;
            } else {
                if (helpAlpha > 0) helpAlpha -= 0.09;
                if (helpX > -150) helpX -= 7;
            }

            if (state === 'DEFEND') {
                let dx = 0, dy = 0;
                if (keys['ArrowUp'] || keys['KeyW']) dy -= 1;
                if (keys['ArrowDown'] || keys['KeyS']) dy += 1;
                if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1;
                if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
                if (dx && dy) { dx *= 0.7071; dy *= 0.7071; }

                soul.x += dx * soul.speed;
                soul.y += dy * soul.speed;

                const m = soul.size + 3;
                soul.x = Math.max(box.x + m, Math.min(box.x + box.w - m, soul.x));
                soul.y = Math.max(box.y + m, Math.min(box.y + box.h - m, soul.y));

                if (soul.inv > 0) soul.inv--;

                timer++;
                spawn();

                for (let i = bones.length - 1; i >= 0; i--) {
                    const b = bones[i];
                    b.x += b.vx; b.y += b.vy;
                    if (hitBone(b) && soul.inv === 0) {
                        playerHP = Math.max(0, playerHP - 11);
                        soul.inv = 34;
                        shake = 12;
                        if (playerHP <= 0) state = 'GAMEOVER';
                    }
                    if (b.x < box.x - 140 || b.x > box.x + box.w + 140 || b.y < box.y - 140 || b.y > box.y + box.h + 140) {
                        bones.splice(i, 1);
                    }
                }

                for (let i = bullets.length - 1; i >= 0; i--) {
                    const b = bullets[i];
                    b.x += b.vx; b.y += b.vy;
                    if (b.bounce) {
                        if (b.y <= box.y + b.r || b.y >= box.y + box.h - b.r) b.vy *= -1;
                        if (b.x <= box.x + b.r || b.x >= box.x + box.w - b.r) b.vx *= -1;
                    }
                    if (Math.hypot(b.x - soul.x, b.y - soul.y) < b.r + soul.size - 1 && soul.inv === 0) {
                        playerHP = Math.max(0, playerHP - 9);
                        soul.inv = 32;
                        shake = 10;
                        if (playerHP <= 0) state = 'GAMEOVER';
                    }
                    if (b.x < box.x - 50 || b.x > box.x + box.w + 50 || b.y < box.y - 50 || b.y > box.y + box.h + 50) {
                        bullets.splice(i, 1);
                    }
                }

                for (let i = blasters.length - 1; i >= 0; i--) {
                    const b = blasters[i];
                    b.timer--;
                    if (b.retreating) {
                        b.retreatProgress += 1 / 22;         
                        if (b.retreatProgress > 1) b.retreatProgress = 1;

                        const ease = b.retreatProgress * b.retreatProgress;
                        b.x = b.finalX + (b.startX - b.finalX) * ease * 1.35;
                        b.y = b.finalY + (b.startY - b.finalY) * ease * 1.35;
                        b.alpha = 1 - b.retreatProgress;
                        b.scale = 1 - b.retreatProgress * 0.45;

                        if (b.retreatProgress >= 1) {
                            blasters.splice(i, 1);
                            continue;
                        }
                    } else {
                        const appearProgress = Math.min(1, (160 - b.timer) / b.appearTime);
                        if (appearProgress < 1) {
                            const t = 1 - Math.pow(1 - appearProgress, 2.3);
                            b.x = b.finalX + (b.x - b.finalX) * (1 - t);
                            b.y = b.finalY + (b.y - b.finalY) * (1 - t);
                            b.alpha = t;
                            b.scale = 0.5 + t * 0.5;
                        } else {
                            b.x = b.finalX;
                            b.y = b.finalY;
                            b.alpha = 1;
                            b.scale = 1;
                        }
                        if (b.timer === 120) {
                            b.fire = true;
                            b.fireProgress = 0;
                        }
                        if (b.fire && b.fireProgress < 1) {
                            b.fireProgress += 1 / b.fireDuration;
                            if (b.fireProgress > 1) b.fireProgress = 1;
                        }
                        if (b.fire && b.fireProgress >= 1) {
                            b.retreating = true;
                            b.retreatProgress = 0;
                        }
                        if (b.timer <= 0) {
                            blasters.splice(i, 1);
                            continue;
                        }
                    }

                    if (b.fire && !b.retreating && soul.inv === 0) {
                        const d = distSeg(soul.x, soul.y, b.x, b.y, b.tx, b.ty);
                        if (d < (b.wide ? 24 : 16)) {
                            playerHP = Math.max(0, playerHP - 18);
                            soul.inv = 40;
                            shake = 16;
                            if (playerHP <= 0) state = 'GAMEOVER';
                        }
                    }
                }

                if (timer >= 500 + attackIdx * 8) {
                    state = 'MENU';
                    setBoxSize('DEFAULT');
                    dialogue = "* ...";
                }
            }

            if (state === 'FIGHT') {
                barX += barDir * 11;
                if (barX < box.x + 30 || barX > box.x + box.w - 30) barDir *= -1;
            }

            if (state === 'DIALOGUE') {
                dialogueTimer--;
                if (dialogueTimer <= 0) {
                    if (evokeActive && (evokePhase === 'enter' || evokePhase === 'play' || evokePhase === 'exit')) {
                    } else {
                        startDefend(menuIdx === 1 || menuIdx === 2);
                    }
                }
            }

            if (evokeActive) {
                evokeTimer++;
                if (evokePhase === 'enter') {
                    evokeAlpha = Math.min(1, evokeAlpha + 0.06);
                    evokeScale = Math.min(1, evokeScale + 0.05);
                    if (evokeAlpha >= 1 && evokeScale >= 1) {
                        evokePhase = 'play';
                        evokeTimer = 0;
                    }
                } else if (evokePhase === 'play') {
                    if (videoEvoke.ended || (videoEvoke.duration > 0 && videoEvoke.currentTime >= videoEvoke.duration - 0.05) || evokeTimer > 400) {
                        evokePhase = 'exit';
                        evokeTimer = 0;
                    }
                } else if (evokePhase === 'exit') {
                    evokeAlpha = Math.max(0, evokeAlpha - 0.07);
                    evokeScale = Math.max(0.2, evokeScale - 0.06);
                    if (evokeAlpha <= 0) {
                        evokeActive = false;
                        evokePhase = 'idle';
                        videoEvoke.pause();
                        videoEvoke.currentTime = 0;
                        startDefend(true);
                    }
                }
            }
        }

        function hitBone(b) {
            return soul.x + soul.size > b.x && soul.x - soul.size < b.x + b.w &&
                   soul.y + soul.size > b.y && soul.y - soul.size < b.y + b.h;
        }

        function distSeg(px, py, x1, y1, x2, y2) {
            const A = px - x1, B = py - y1, C = x2 - x1, D = y2 - y1;
            const len = C * C + D * D;
            let t = len ? Math.max(0, Math.min(1, (A * C + B * D) / len)) : 0;
            return Math.hypot(px - (x1 + t * C), py - (y1 + t * D));
        }

        function drawSoul(x, y, s) {
            const flash = soul.inv > 0 && Math.floor(soul.inv / 3) % 2 === 0;
            ctx.fillStyle = flash ? '#880000' : '#ff0000';
            ctx.beginPath();
            ctx.moveTo(x, y + s * 0.3);
            ctx.bezierCurveTo(x, y - s * 0.55, x - s * 1.05, y - s * 0.55, x - s * 1.05, y + s * 0.2);
            ctx.bezierCurveTo(x - s * 1.05, y + s * 0.75, x, y + s * 1.15, x, y + s * 1.15);
            ctx.bezierCurveTo(x, y + s * 1.15, x + s * 1.05, y + s * 0.75, x + s * 1.05, y + s * 0.2);
            ctx.bezierCurveTo(x + s * 1.05, y - s * 0.55, x, y - s * 0.55, x, y + s * 0.3);
            ctx.fill();
        }

        function drawBone(b) {
            ctx.fillStyle = '#fff';
            ctx.fillRect(Math.round(b.x + 2), Math.round(b.y + 8), b.w - 4, b.h - 16);
            ctx.beginPath();
            ctx.ellipse(b.x + b.w / 2, b.y + 10, b.w / 2 + 2, 10, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(b.x + b.w / 2, b.y + b.h - 10, b.w / 2 + 2, 10, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawBlaster(b) {
            const firing = b.fire && !b.retreating;
            ctx.save();
            ctx.globalAlpha = b.alpha ?? 1;

            const angle = Math.atan2(b.ty - b.y, b.tx - b.x);
            ctx.save();
            ctx.translate(b.x, b.y);
            ctx.rotate(angle - Math.PI / 2); 

            const img = firing ? imgBlasterFiring : imgBlasterNormal;
            const size = 95 * (b.scale ?? 1);

            if (img.complete && img.naturalWidth > 0) {
                ctx.drawImage(img, -size/2, -size/2, size, size);
            } else {
                ctx.fillStyle = firing ? '#00ffff' : '#ff2222';
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(-28, -28, 56, 56, 8);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(0, -6, 9, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore(); 

            if (firing) {
                const mouthOffset = size * 0.28; 
                const startX = b.x + Math.cos(angle) * mouthOffset;
                const startY = b.y + Math.sin(angle) * mouthOffset;
                const fullDx = b.tx - startX;
                const fullDy = b.ty - startY;
                const fullLen = Math.hypot(fullDx, fullDy);
                const t = b.fireProgress ?? 1;
                const ease = 1 - Math.pow(1 - t, 2.5);  
                const currentLen = fullLen * ease;
                const beamWidth = (b.wide ? 32 : 20) * (0.7 + ease * 0.3);

                ctx.save();
                ctx.translate(startX, startY);
                ctx.rotate(angle);

                if (typeof imgBeam !== 'undefined' && imgBeam.complete && imgBeam.naturalWidth > 0) {
                    ctx.globalAlpha = 0.95;
                    ctx.drawImage(imgBeam, 0, -beamWidth/2, currentLen, beamWidth);
                    ctx.globalAlpha = 1;
                } else {
                    const g = ctx.createLinearGradient(0, 0, currentLen, 0);
                    g.addColorStop(0, '#00ffff');
                    g.addColorStop(0.5, '#ffffff');
                    g.addColorStop(1, '#00ffff');

                    ctx.strokeStyle = g;
                    ctx.lineWidth = beamWidth;
                    ctx.globalAlpha = 0.92;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(currentLen, 0);
                    ctx.stroke();

                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = beamWidth * 0.4;
                    ctx.globalAlpha = 1;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(currentLen, 0);
                    ctx.stroke();

                    ctx.strokeStyle = '#00ffff';
                    ctx.lineWidth = beamWidth * 1.3;
                    ctx.globalAlpha = 0.25;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(currentLen, 0);
                    ctx.stroke();
                    ctx.globalAlpha = 1;
                }
                ctx.restore();
            }

            ctx.restore(); 
        }

        function render() {
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);
            
            if (shake > 0) {
                const sx = (Math.random() - 0.5) * shake * 1.6;
                const sy = (Math.random() - 0.5) * shake * 1.6;
                ctx.translate(sx, sy);
            }
            
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);
            
            boss.bob += 0.02;
            const by = boss.y + Math.sin(boss.bob) * 12;
            
            if (imgBoss.complete && imgBoss.naturalWidth > 0) {
                const size = 160;
                ctx.drawImage(imgBoss, boss.x - size/2, by - size/2+50, size, size);
            } else {
                ctx.fillStyle = '#1a0a0a';
                ctx.fillRect(boss.x - 70, by - 70, 140, 140);
                ctx.strokeStyle = '#ff4444';
                ctx.lineWidth = 3;
                ctx.strokeRect(boss.x - 70, by - 70, 140, 140);
                ctx.fillStyle = '#ff3333';
                ctx.font = '36px VT323';
                ctx.textAlign = 'center';
                ctx.fillText('???', boss.x, by + 12);
            }

            if (evokeActive && evokeAlpha > 0) {
                const vSize = 160 * evokeScale;
                const vx = boss.x - 220;
                const vy = by + 50;
                ctx.save();
                ctx.globalAlpha = evokeAlpha;
                if (videoEvoke.readyState >= 2) {
                    ctx.drawImage(videoEvoke, vx - vSize / 2, vy - vSize / 2, vSize, vSize);
                } else {
                    ctx.fillStyle = '#220044';
                    ctx.fillRect(vx - vSize / 2, vy - vSize / 2, vSize, vSize);
                    ctx.strokeStyle = '#ff00ff';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(vx - vSize / 2, vy - vSize / 2, vSize, vSize);
                    ctx.fillStyle = '#ff66ff';
                    ctx.font = '22px VT323';
                    ctx.textAlign = 'center';
                    ctx.fillText('PAPI', vx, vy + 8);
                }
                ctx.restore();
            }

            ctx.fillStyle = '#ff5555';
            ctx.font = '26px VT323';
            ctx.textAlign = 'center';
            ctx.fillText('TREVITY', boss.x, by - 45);

            ctx.fillStyle = '#222';
            ctx.fillRect(boss.x - 110, by - 40, 220, 18);
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(boss.x - 110, by - 40, (bossHP / maxBossHP) * 220, 18);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.strokeRect(boss.x - 110, by - 40, 220, 18);

            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 5;
            ctx.strokeRect(box.x, box.y, box.w, box.h);
            ctx.fillStyle = '#000';
            ctx.fillRect(box.x + 3, box.y + 3, box.w - 6, box.h - 6);

            if (currentHelp && helpImages[currentHelp] && helpAlpha > 0) {
                const img = helpImages[currentHelp];
                if (img.complete && img.naturalWidth > 0) {
                    ctx.save();
                    ctx.globalAlpha = helpAlpha;
                    const width = 120;
                    const height = 200; 
                    const imgY = box.y + box.h / 2 - height / 2;
                    ctx.drawImage(img, box.x - 170, imgY, width, height);
                    ctx.restore();
                }
            }

            if (state === 'DEFEND') {
                bones.forEach(drawBone);
                bullets.forEach(b => {
                    ctx.fillStyle = b.color;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                    ctx.fill();
                });
                blasters.forEach(drawBlaster);
                drawSoul(soul.x, soul.y, soul.size);
            } else if (state === 'MENU' || state === 'DIALOGUE') {
                ctx.fillStyle = '#fff';
                ctx.font = '32px VT323';
                ctx.textAlign = 'left';
                dialogue.split('\n').forEach((l, i) => ctx.fillText(l, box.x + 40, box.y + 60 + i * 45));
            } else if (state === 'ACT') {
                ctx.fillStyle = '#fff';
                ctx.font = '32px VT323';
                ctx.textAlign = 'left';
                acts.forEach((opt, i) => {
                    const sel = i === actIdx;
                    ctx.fillStyle = sel ? '#ffff00' : '#fff';
                    ctx.fillText((sel ? '> ' : '  ') + opt, box.x + 50, box.y + 70 + i * 55);
                });
            } else if (state === 'FIGHT') {
                const barAreaY = box.y + 15;
                const barAreaH = box.h - 30;
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(box.x + 30, barAreaY, box.w - 60, barAreaH);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3;
                ctx.strokeRect(box.x + 30, barAreaY, box.w - 60, barAreaH);
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(box.x + box.w / 2 - 10, barAreaY, 20, barAreaH);
                ctx.fillStyle = '#ffff00';
                ctx.fillRect(box.x + box.w / 2 - 32, barAreaY, 14, barAreaH);
                ctx.fillRect(box.x + box.w / 2 + 18, barAreaY, 14, barAreaH);
                ctx.fillStyle = '#fff';
                ctx.fillRect(barX - 5, barAreaY - 5, 10, barAreaH + 10);
                ctx.fillStyle = '#fff';
                ctx.font = '28px VT323';
                ctx.textAlign = 'center';
                ctx.fillText('Press Z when the bar is in the center!', 720, box.y - 18);
            }

            const hpSectionY = 640;

            ctx.fillStyle = '#fff';
            ctx.font = '26px VT323';
            ctx.textAlign = 'left';
            ctx.fillText(playerName === null ? "PLAYER" : playerName, 440, hpSectionY + 22);
            ctx.fillText("LV 19", 540, hpSectionY + 22);
            ctx.fillText("HP", 640, hpSectionY + 22);

            ctx.fillStyle = '#ff0000';
            ctx.fillRect(680, hpSectionY, 180, 24);
            
            ctx.fillStyle = '#ffff00';
            ctx.fillRect(680, hpSectionY, (playerHP / maxHP) * 180, 24);
            
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.strokeRect(680, hpSectionY, 180, 24);

            ctx.fillStyle = '#fff';
            ctx.fillText(`${playerHP} / ${maxHP}`, 875, hpSectionY + 22);

            const menuY = 700;
            menu.forEach((label, i) => {
                const sel = state === 'MENU' && menuIdx === i;
                const color = sel ? '#ffff00' : '#ff8800';
                ctx.fillStyle = color;
                
                const w = 190;
                const h = 55;
                const startX = 255; 
                const x = startX + i * 245;
                const y = menuY;

                ctx.strokeStyle = color;
                ctx.lineWidth = sel ? 3 : 2;
                ctx.strokeRect(x, y, w, h);
                
                if (sel) {
                    drawSoul(x + 20, (y + h / 2) - 2, 9);
                }
                
                ctx.font = '48px VT323';
                ctx.textAlign = 'center';
                ctx.fillText(label, x + w / 2, y + 40);
            });

            if (state === 'GAMEOVER') {
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);
                ctx.fillStyle = '#ff0000';
                ctx.font = '96px VT323';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', 720, 380);
                ctx.font = '36px VT323';
                ctx.fillStyle = '#fff';
                ctx.fillText('Press F5 to try again', 720, 460);
            }
            if (state === 'VICTORY') {
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);
                ctx.fillStyle = '#00ff00';
                ctx.font = '96px VT323';
                ctx.textAlign, ctx.textAlign = 'center';
                ctx.fillText('YOU WON!', 720, 380);
                ctx.font = '36px VT323';
                ctx.fillStyle = '#fff';
                ctx.fillText('The enemy has been defeated.', 720, 460);
            }

            ctx.restore();
        }

        function resizeCanvas() {
            const container = document.getElementById('game-container');
            const w = container.clientWidth;
            const h = container.clientHeight;
            
            const ratio = VIRTUAL_WIDTH / VIRTUAL_HEIGHT;
            if (w / h > ratio) {
                canvas.style.height = '100%';
                canvas.style.width = (h * ratio) + 'px';
            } else {
                canvas.style.width = '100%';
                canvas.style.height = (w / ratio) + 'px';
            }
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function loop() {
            update();
            render();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
