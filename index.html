<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Undertale Boss Battle Prototype</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    #controls {
      margin-bottom: 15px;
      text-align: center;
    }

    input[type="file"] {
      display: none;
    }

    .btn {
      background: #000;
      color: #fff;
      border: 2px solid #fff;
      padding: 8px 16px;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
      margin: 5px;
    }

    .btn:hover {
      background: #fff;
      color: #000;
    }

    canvas {
      background-color: #000;
      border: 4px solid #fff;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <div id="controls">
    <label class="btn">
      Carica Immagine Boss
      <input type="file" id="bossLoader" accept="image/*" />
    </label>
    <button class="btn" onclick="resetGame()">Riavvia Battaglia</button>
  </div>

  <canvas id="gameCanvas" width="600" height="600"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let gameOver = false;
    let victory = false;
    let timer = 0; 
    const MAX_TIME = 120 * 60; 

    const box = {
      x: 175,
      y: 320,
      width: 250,
      height: 220
    };
    const player = {
      x: box.x + box.width / 2,
      y: box.y + box.height / 2,
      size: 8,
      speed: 3.5,
      hp: 92,
      maxHp: 92,
      invulnerableTimer: 0
    };
    let bossImage = null;
    const boss = {
      x: 300,
      y: 120,
      width: 120,
      height: 120,
      angle: 0
    };

    let bullets = [];
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    document.getElementById('bossLoader').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          const img = new Image();
          img.onload = function() {
            bossImage = img;
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    function resetGame() {
      player.x = box.x + box.width / 2;
      player.y = box.y + box.height / 2;
      player.hp = player.maxHp;
      player.invulnerableTimer = 0;
      bullets = [];
      timer = 0;
      gameOver = false;
      victory = false;
    }

    function update() {
      if (gameOver || victory) return;

      timer++;
      if (timer >= MAX_TIME) {
        victory = true;
        return;
      }

      let dx = 0;
      let dy = 0;

      if (keys['ArrowUp'] || keys['KeyW']) dy -= 1;
      if (keys['ArrowDown'] || keys['KeyS']) dy += 1;
      if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1;
      if (keys['ArrowRight'] || keys['KeyD']) dx += 1;

      if (dx !== 0 && dy !== 0) {
        dx *= 0.7071;
        dy *= 0.7071;
      }

      player.x += dx * player.speed;
      player.y += dy * player.speed;
      player.x = Math.max(box.x + player.size, Math.min(box.x + box.width - player.size, player.x));
      player.y = Math.max(box.y + player.size, Math.min(box.y + box.height - player.size, player.y));

      if (player.invulnerableTimer > 0) player.invulnerableTimer--;

      boss.angle += 0.03;
      boss.x = 300 + Math.sin(boss.angle) * 120;
      boss.y = 120 + Math.cos(boss.angle * 1.5) * 20;

      spawnAttacks();

      for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;

        const dist = Math.hypot(b.x - player.x, b.y - player.y);
        if (dist < b.radius + player.size - 2) {
          if (player.invulnerableTimer === 0) {
            player.hp -= 10;
            player.invulnerableTimer = 40; // Frame di invulnerabilità
            if (player.hp <= 0) {
              player.hp = 0;
              gameOver = true;
            }
          }
        }

        if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
          bullets.splice(i, 1);
        }
      }
    }

    function spawnAttacks() {
      if (timer % 12 === 0) {
        let angle = (timer / 10);
        bullets.push({
          x: boss.x,
          y: boss.y,
          vx: Math.cos(angle) * 4,
          vy: Math.sin(angle) * 4,
          radius: 6,
          color: '#ff4444'
        });
      }

      if (timer > 30 * 60 && timer % 45 === 0) {
        let angleToPlayer = Math.atan2(player.y - boss.y, player.x - boss.x);
        bullets.push({
          x: boss.x,
          y: boss.y,
          vx: Math.cos(angleToPlayer) * 6.5,
          vy: Math.sin(angleToPlayer) * 6.5,
          radius: 8,
          color: '#00ffff'
        });
      }

      if (timer > 60 * 60 && timer % 15 === 0) {
        let randomX = box.x + Math.random() * box.width;
        bullets.push({
          x: randomX,
          y: 0,
          vx: (Math.random() - 0.5) * 1.5,
          vy: 5,
          radius: 5,
          color: '#ffff00'
        });
      }
    }

    function drawHeart(x, y, size) {
      ctx.fillStyle = player.invulnerableTimer % 6 < 3 ? '#ff0000' : '#880000';
      ctx.beginPath();
      ctx.moveTo(x, y + size / 4);
      ctx.quadraticCurveTo(x, y - size / 2, x - size / 2, y - size / 2);
      ctx.quadraticCurveTo(x - size, y - size / 2, x - size, y + size / 4);
      ctx.quadraticCurveTo(x - size, y + size / 2, x, y + size);
      ctx.quadraticCurveTo(x + size, y + size / 2, x + size, y + size / 4);
      ctx.quadraticCurveTo(x + size, y - size / 2, x + size / 2, y - size / 2);
      ctx.quadraticCurveTo(x, y - size / 2, x, y + size / 4);
      ctx.fill();
    }

    function render() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (bossImage) {
        ctx.drawImage(bossImage, boss.x - boss.width / 2, boss.y - boss.height / 2, boss.width, boss.height);
      } else {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(boss.x - boss.width / 2, boss.y - boss.height / 2, boss.width, boss.height);
        ctx.fillStyle = '#fff';
        ctx.font = '14px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('Carica Boss', boss.x, boss.y);
      }

      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 5;
      ctx.strokeRect(box.x, box.y, box.width, box.height);

      drawHeart(player.x, player.y, player.size);

      bullets.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.fillStyle = '#fff';
      ctx.font = '18px Courier New';
      ctx.textAlign = 'left';
      ctx.fillText(`HP: ${player.hp} / ${player.maxHp}`, box.x, box.y + box.height + 35);
      ctx.fillStyle = '#ff0000';
      ctx.fillRect(box.x + 150, box.y + box.height + 20, 100, 18);
      ctx.fillStyle = '#ffff00';
      ctx.fillRect(box.x + 150, box.y + box.height + 20, (player.hp / player.maxHp) * 100, 18);

      let secondsLeft = Math.ceil((MAX_TIME - timer) / 60);
      ctx.textAlign = 'right';
      ctx.fillText(`Tempo: ${secondsLeft}s`, box.x + box.width, box.y + box.height + 35);

      if (gameOver) {
        ctx.fillStyle = '#ff0000';
        ctx.font = '36px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
      } else if (victory) {
        ctx.fillStyle = '#00ff00';
        ctx.font = '36px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('VITTORIA!', canvas.width / 2, canvas.height / 2);
      }
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
